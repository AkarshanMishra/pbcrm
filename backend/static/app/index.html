<!DOCTYPE html>
<html>
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PCRM - Enterprise Workforce Management">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PCRM Enterprise">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PCRM Enterprise Portal</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0F172A;
      color: #F8FAFC;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1E293B;
      border-top: 4px solid #3B82F6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #F8FAFC;
    }
    .subtitle {
      font-size: 13px;
      color: #94A3B8;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="title">PCRM Enterprise</div>
    <div class="subtitle">Initializing secure workspace...</div>
  </div>

  <script>
    // Forcibly clear any stale PWA service workers and CacheStorage
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }

    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 400);
      }
    });

    // Fallback timer: if first frame isn't fired in 3s, fade loader anyway
    setTimeout(function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 400);
      }
    }, 3000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
